<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gardes loyales de Ryan Collation inc.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
    }
    .box {
      background: #1c1c1c;
      padding: 2rem;
      border-radius: 8px;
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid #333;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 1rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #111;
      color: #eee;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      background: #2a7;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #2a6;
    }
    .error {
      color: #f55;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.7rem;
      border-bottom: 1px solid #333;
      text-align: left;
    }
    th {
      background: #1c1c1c;
    }
    tr:hover {
      background: #181818;
    }
    .logout {
      margin-top: 1.5rem;
      color: #f77;
      cursor: pointer;
      text-decoration: underline;
      text-align: center;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div id="login-view" class="box">
    <h1>Accès Gardes</h1>
    <div class="error" id="error"></div>
    <input type="text" id="username" placeholder="Nom d'utilisateur">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
  </div>

  <div id="dashboard-view" class="hidden">
    <h1>ChroniLivres · Tableau des salaires</h1>
    <div id="table-container">Chargement...</div>
    <div class="logout" onclick="logout()">Se déconnecter</div>
  </div>

  <script>
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const tableContainer = document.getElementById('table-container');
    const errorBox = document.getElementById('error');

    function showDashboard() {
      loginView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
      loadSalaries();
    }

    function showLogin() {
      dashboardView.classList.add('hidden');
      loginView.classList.remove('hidden');
    }

    async function login() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      errorBox.textContent = '';

      try {
        const res = await fetch('signin.json');
        const data = await res.json();

        const user = data.users.find(u =>
          u.username === username &&
          u.email === email &&
          u.password === password
        );

        if (user) {
          localStorage.setItem('chroni_user', username);
          showDashboard();
        } else {
          errorBox.textContent = 'Identifiants incorrects.';
        }
      } catch (e) {
        errorBox.textContent = 'Erreur de chargement.';
      }
    }

    async function loadSalaries() {
      try {
        const res = await fetch('info.json');
        const data = await res.json();

        let html = '<table><tr><th>Niveau</th><th>Nom</th><th>Numéro</th><th>Salaire (€)</th></tr>';

        data.employees.forEach(e => {
          html += `<tr>
            <td>${e.level}</td>
            <td>${e.name}</td>
            <td>${e.number}</td>
            <td>${e.salary}</td>
          </tr>`;
        });

        html += '</table>';
        tableContainer.innerHTML = html;
      } catch (e) {
        tableContainer.textContent = 'Erreur de chargement des données.';
      }
    }

    function logout() {
      localStorage.removeItem('chroni_user');
      showLogin();
    }

    if (localStorage.getItem('chroni_user')) {
      showDashboard();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
